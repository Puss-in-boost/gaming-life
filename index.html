r:1px solid #404a60;border-radius:11px;margin:9px 0}.checkline input{accent-color:var(--mint);margin-top:4px}.toast{position:fixed;bottom:25px;right:25px;z-index:50;background:#2f4d48;color:#e6fff8;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;max-width:340px}.bottomnav{display:none}.data-actions{display:flex;gap:9px;flex-wrap:wrap}.category{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.top-action{margin-bottom:8px}.small-link{font-size:12px;color:var(--mint);border:0;background:none;padding:0;font-weight:700}.small-link:hover{text-decoration:underline}.muted-divider{border:0;border-top:1px solid var(--stroke);margin:20px 0}.footnote{font-size:12px;color:var(--muted);padding:15px 2px}.hidden{display:none!important}

<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon" aria-hidden="true">✦</div><span>Gaming Life</span></div>
      <nav class="nav" aria-label="页面导航" id="nav-side"></nav>
      <div class="sidebar-note"><strong>第一章 · 毕业与新生活</strong>不追求每日满分。主线推进一点，现实就前进一步。</div>
    </aside>
    <main class="main" id="app" aria-live="polite"></main>
  </div>
  <nav class="bottomnav" aria-label="移动端导航" id="nav-bottom"></nav>
  <div id="modal-root"></div><div id="toast-root" role="status" aria-live="polite"></div><div id="reward-root" role="status" aria-live="polite"></div>
<script>
'use strict';
(function(){
const KEY='gaming-life-v1-local';
const AREAS=[['career','职业与专业','💼'],['learning','认知与知识','📚'],['finance','经济与财务','💰'],['social','人格与社交','🤝'],['health','体魄与健康','💪'],['explore','生活与探索','🧭']];
const NAV=[['today','今日','✦'],['journey','旅程','◇'],['history','日志','▤'],['settings','设置','⚙']];
const DEFAULT_TASKS=[
  {id:'thesis',title:'推进硕士论文修改',detail:'选择一处需要修改的正文、图或评审意见，完成并保存实际改动。',kind:'main',area:'career',xp:50,repeat:'daily',icon:'📄',active:true},
  {id:'workout',title:'力量训练 / 排球 / 恢复',detail:'遵循当天实际安排，不为经验值额外增加训练负担。',kind:'side',area:'health',xp:15,repeat:'daily',icon:'💪',active:true},
  {id:'learn',title:'知识探索 · 20分钟',detail:'学一个有兴趣的概念，用自己的话说明它。',kind:'side',area:'learning',xp:15,repeat:'daily',icon:'📚',active:true},
  {id:'career',title:'职业探索 · 一个实际动作',detail:'认真看一个岗位，或改一处简历，或完成一项投递准备。',kind:'side',area:'career',xp:20,repeat:'weekly',icon:'🧩',active:true},
  {id:'money',title:'整理本周财务',detail:'查看本周支出与余额，不需要补齐所有历史账单。',kind:'side',area:'finance',xp:15,repeat:'weekly',icon:'💰',active:true},
  {id:'social',title:'主动联系或表达一次',detail:'有真实意愿时主动发起交流，不制造社交KPI。',kind:'side',area:'social',xp:15,repeat:'weekly',icon:'🤝',active:true},
  {id:'explore',title:'给生活一点新鲜感',detail:'一次喜欢的城市探索、阅读、排球活动或其他体验。',kind:'side',area:'explore',xp:15,repeat:'weekly',icon:'🧭',active:true}
];
const MILESTONES=[
{id:'revision',title:'完成论文主要修改',desc:'以可确认的论文成果为准。',xp:150},
{id:'review',title:'完成下一步送审事务',desc:'按照学校的真实流程推进，不预设审核结果。',xp:150},
{id:'graduation',title:'完成毕业阶段',desc:'完成必要的答辩及毕业事项。',xp:200},
{id:'job',title:'获得合适的职业起点',desc:'找到符合现实条件、值得尝试的工作机会。',xp:200}
];
const DEFAULT=()=>({version:1,createdAt:new Date().toISOString(),tasks:structuredClone(DEFAULT_TASKS),events:[],notes:[],milestones:{},modes:{},sideChoice:{},mainId:'thesis'});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===1&&Array.isArray(v.tasks)&&Array.isArray(v.events)&&Array.isArray(v.notes))return {...DEFAULT(),...v};}catch(e){}return DEFAULT()}
let state=load(),screen='today',modal='',toastTimer=null,pendingText='',pendingIds=[],validatedPack=null,rewardTimer=null;
let lastDate='';
const el=(id)=>document.getElementById(id);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const mondayKey=(s)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const humanDate=(s)=>{const d=new Date(s+'T12:00:00');return `${d.getMonth()+1}月${d.getDate()}日 · ${['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}`};
const areaInfo=id=>AREAS.find(a=>a[0]===id)||AREAS[0];
const activeTasks=()=>state.tasks.filter(x=>x.active!==false);
const taskById=id=>state.tasks.find(x=>x.id===id);
const taskCompleted=(t,s=today())=>state.events.some(e=>e.taskId===t.id&&(t.repeat==='once'||(t.repeat==='daily'&&e.date===s)||(t.repeat==='weekly'&&mondayKey(e.date)===mondayKey(s))));
const eventFor=(t,s=today())=>state.events.find(e=>e.taskId===t.id&&(t.repeat==='once'||(t.repeat==='daily'&&e.date===s)||(t.repeat==='weekly'&&mondayKey(e.date)===mondayKey(s))));
const totalXP=()=>state.events.reduce((x,e)=>x+(Number(e.xp)||0),0)+Object.values(state.milestones).reduce((x,m)=>x+(m?.xp||0),0);
function levelInfo(total){let level=1,left=total,need=100;while(left>=need&&level<999){left-=need;level++;need=100+25*(level-1)}return{level,earned:left,need,pct:Math.min(100,100*left/need)}}
const dailyEvents=()=>state.events.filter(e=>e.date===today());
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){notify('浏览器未能保存记录。请检查隐私模式或存储权限。');return false}}
function notify(message){const root=el('toast-root');root.innerHTML=`<div class="toast">${safe(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3100)}
function navigate(target){screen=target;modal='';render();window.scrollTo({top:0,behavior:'instant'})}
function navRender(){let markup=NAV.map(([id,label,icon])=>`<button type="button" class="nav-button ${screen===id?'active':''}" data-action="nav" data-screen="${id}" aria-current="${screen===id?'page':'false'}"><span class="nav-icon" aria-hidden="true">${icon}</span>${label}</button>`).join('');el('nav-side').innerHTML=markup;el('nav-bottom').innerHTML=NAV.map(([id,label,icon])=>`<button type="button" class="${screen===id?'active':''}" data-action="nav" data-screen="${id}" aria-label="${label}" aria-current="${screen===id?'page':'false'}"><span aria-hidden="true">${icon}</span>${label}</button>`).join('')}
function celebration(xp,oldLevel,title){const now=levelInfo(totalXP());const up=now.level>oldLevel;const root=el('reward-root');root.innerHTML=`<div class="xp-celebration ${up?'levelup':''}"><span class="reward-title">${up?'LEVEL UP · 等级提升！':'QUEST CLEAR · 任务完成'}</span><b>${up?'LV. '+now.level:'+'+xp+' XP'}</b><span>${safe(title)}</span>${up?`<span>获得 ${xp} XP · 新等级已解锁</span>`:''}</div>`;clearTimeout(rewardTimer);rewardTimer=setTimeout(()=>root.innerHTML='',2500)}
function completion(t){let v=eventFor(t);if(v){state.events=state.events.filter(e=>e.id!==v.id);save();notify('已撤销这次完成记录');}else{const oldLevel=levelInfo(totalXP()).level;state.events.push({id:uid(),taskId:t.id,title:t.title,xp:Number(t.xp)||0,area:t.area,kind:t.kind,date:today(),at:new Date().toISOString(),note:''});if(save())celebration(Number(t.xp)||0,oldLevel,t.title);notify(`任务完成！ +${t.xp} XP`)}render()}
function uid(){return (crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2))}
// AI-free task pack protocol. Only the user can preview/confirm modifications.
const PACK_FORMAT='gaming-life.quest-pack';
function checkPack(raw){
 if(typeof raw!=='string'||raw.length>45000)throw Error('任务包文本过长（最多45KB）');
 let pack;try{pack=JSON.parse(raw)}catch(e){throw Error('不是有效的 JSON，请直接复制完整任务包')}
 if(!pack||typeof pack!=='object'||Array.isArray(pack)||pack.format!==PACK_FORMAT||pack.version!==1)throw Error('任务包格式或版本不正确');
 if(typeof pack.packId!=='string'||! /^[a-zA-Z0-9_-]{3,60}$/.test(pack.packId))throw Error('packId 只能用3–60位字母、数字、_ 或 -');
 if(typeof pack.title!=='string'||!pack.title.trim()||pack.title.length>90)throw Error('任务包名称不能为空且不超过90字');
 if(!Array.isArray(pack.quests)||pack.quests.length===0||pack.quests.length>30)throw Error('任务数必须在1–30之间');
 const used=new Set();const normalized=[];
 for(const q of pack.quests){
  if(!q||typeof q!=='object'||Array.isArray(q))throw Error('任务格式不正确');
  const id=q.id, title=q.title, detail=q.detail??'';
  if(typeof id!=='string'||! /^[a-zA-Z0-9_-]{1,60}$/.test(id)||used.has(id))throw Error('任务 id 无效或重复');
  used.add(id);
  if(typeof title!=='string'||!title.trim()||title.length>65)throw Error(`任务 ${id} 的标题无效（最多65字）`);
  if(typeof detail!=='string'||detail.length>250)throw Error(`任务 ${id} 的说明过长`);
  if(!['main','side'].includes(q.kind)||!AREAS.some(a=>a[0]===q.area)||!['once','daily','weekly'].includes(q.repeat))throw Error(`任务 ${id} 的类别/领域/周期无效`);
  if(!Number.isInteger(q.xp)||q.xp<5||q.xp>80)throw Error(`任务 ${id} 的 XP 应为5–80之间的整数`);
  normalized.push({id, title:title.trim(),detail:detail.trim(),kind:q.kind,area:q.area,repeat:q.repeat,xp:q.xp});
 }
 if(pack.focusId!==undefined&&pack.focusId!==null&&(!used.has(pack.focusId)||normalized.find(q=>q.id===pack.focusId)?.kind!=='main'))throw Error('focusId 必须指向本任务包中的主线任务');
 return{packId:pack.packId,title:pack.title.trim(),quests:normalized,focusId:pack.focusId||null};
}
function packKey(packId,id){return packId+':'+id}
function packPreview(){if(!validatedPack)return '';const pack=validatedPack;let added=0,updated=0;const lines=pack.quests.map(q=>{const found=state.tasks.find(t=>t.packKey===packKey(pack.packId,q.id));found?updated++:added++;return `<div class="activity"><div class="activity-main"><strong>${safe(q.title)}</strong><small>${found?'更新已导入任务':'新增任务'} · ${q.kind==='main'?'主线':'支线'} · ${q.xp} XP · ${q.repeat==='daily'?'每天':q.repeat==='weekly'?'每周':'仅一次'}</small></div></div>`}).join('');return `<div class="pack-preview"><h3>「${safe(pack.title)}」预览</h3><p class="hint">新增 ${added} 项 · 更新 ${updated} 项；不会自动完成任务或改变既有 XP。</p>${lines}</div>`}
function importPack(pack){
 // Commit is intentionally non-destructive: no activity/event records are changed or removed.
 let mainId=null;
 for(const q of pack.quests){const key=packKey(pack.packId,q.id);let t=state.tasks.find(t=>t.packKey===key);
  if(t){Object.assign(t,{title:q.title,detail:q.detail,kind:q.kind,area:q.area,repeat:q.repeat,xp:q.xp,icon:areaInfo(q.area)[2],active:true});}
  else{t={id:uid(),packKey:key,title:q.title,detail:q.detail,kind:q.kind,area:q.area,repeat:q.repeat,xp:q.xp,icon:areaInfo(q.area)[2],active:true};state.tasks.push(t)}
  if(q.id===pack.focusId&&q.kind==='main')mainId=t.id;
 }
 if(mainId)state.mainId=mainId;
 if(!save())return;
 validatedPack=null;modal='';navigate('today');notify(`任务包「${pack.title}」已导入，历史进度保留`);
}

 return {format:'gaming-life.state-snapshot',version:1,capturedAt:new Date().toISOString(),localDate:today(),totalXP:xp,level:l.level,remainingToNextLevel:l.need-l.earned,

}

function hero(){const t=totalXP(),l=levelInfo(t),daily=dailyEvents(),done=daily.filter(e=>e.kind==='main').length;return `<section class="hero"><div class="hero-top"><div><div class="chapter">CHAPTER 01 / 毕业与新生活</div><h2>今天，也能推进一点点。</h2><p>今天不需要满分。有真实进展，就是有效的一天。</p></div><div class="level" title="角色等级"><small>LEVEL</small><b>${l.level}</b></div></div><div class="xp-info"><span>成长经验 <strong>${t} XP</strong></span><span>距离 LV.${l.level+1}：${l.need-l.earned} XP</span></div><div class="progress" role="progressbar" aria-label="当前等级进度" aria-valuenow="${Math.round(l.pct)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${l.pct}%"></span></div><div class="stats"><div class="stat"><strong>${daily.reduce((v,e)=>v+e.xp,0)} <small style="font-size:11px">XP</small></strong><span>今日获得</span></div><div class="stat"><strong>${done?'已推进':'待出发'}</strong><span>今日主线</span></div><div class="stat"><strong>${Object.keys(state.milestones).filter(id=>!!state.milestones[id]).length}/${MILESTONES.length}</strong><span>本章里程碑</span></div></div></section>`}

if(modal==='sides')return `<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-top"><h2 id="dialog-title">今天想做哪些支线？</h2><button class="modal-close" data-action="close" aria-label="关闭">×</button></div><p class="hint">最多选2项，完全可以不选。完成的支线不会重复刷 XP。</p><form id="side-form">${activeTasks().filter(t=>t.kind==='side').map(t=>`<label class="checkline"><input type="checkbox" name="side" value="${safe(t.id)}" ${currentSides().some(s=>s.id===t.id)?'checked':''}><span>${safe(t.icon)} <strong>${safe(t.title)}</strong><br><span class="hint">${t.xp} XP ${taskCompleted(t)?'· 本周期已完成':''}</span></span></label>`).join('')}<div class="modal-actions"><button type="button" class="btn" data-action="close">取消</button><button type="submit" class="btn btn-primary">使用今天的选择</button></div></form></div></div>`;
if(modal==='main')return `<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-top"><h2 id="dialog-title">选择当前主线</h2><button class="modal-close" data-action="close" aria-label="关闭">×</button></div><p class="hint">重要阶段专注一条主线；不需要让所有事情同时成为主线。</p>${activeTasks().filter(t=>t.kind==='main').map(t=>`<button class="btn" style="display:flex;width:100%;justify-content:flex-start;margin-bottom:9px" data-action="set-main" data-id="${safe(t.id)}">${safe(t.icon)} ${safe(t.title)} ${state.mainId===t.id?'✓':''}</button>`).join('')}<div class="modal-actions"><button class="btn btn-primary" data-action="open-create">＋ 创建新主线</button></div></div></div>`;
if(modal==='capture')return `<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-top"><h2 id="dialog-title">核对你的记录</h2><button class="modal-close" data-action="close" aria-label="关闭">×</button></div><p>${safe(pendingText)}</p><p class="hint">下面只是本地关键词猜测，勾选确实完成的任务才会获得 XP。</p><form id="capture-form">${pendingIds.length?pendingIds.map(id=>{let t=taskById(id);return t?`<label class="checkline"><input type="checkbox" name="matched" value="${safe(id)}" checked ${taskCompleted(t)?'disabled':''}><span>${safe(t.icon)} <strong>${safe(t.title)}</strong><br><span class="hint">${taskCompleted(t)?'本周期已经记录':'完成后 +'+t.xp+' XP'}</span></span></label>`:''}).join(''):'<p class="hint">没有发现明确匹配的任务。你仍可以保存这句日志。</p>'}<div class="modal-actions"><button type="button" class="btn" data-action="close">取消</button><button type="submit" class="btn btn-primary">确认并保存记录</button></div></form></div></div>`;return ''}
function matchText(raw){const rules=[['thesis',/(论文|盲审|正文|改了第.?章|修改了|修订了)/],['workout',/(练了|健身|训练|排球|锻炼|跑步|拉伸|恢复训练)/],['learn',/(读了|阅读了|学了|学习了|看书|经济学|新概念)/],['career',/(求职|投递了|岗位|简历|面试)/],['money',/(记账|收支|预算|财务)/],['social',/(联系了|交流了|约了朋友|主动发消息)/],['explore',/(出游|旅行|逛了|探索了)/]];const clauses=raw.split(/[，,。；;、\n]/).map(s=>s.trim()).filter(Boolean);const out=[];for(const [id,re] of rules){const t=taskById(id);if(!t||t.active===false||taskCompleted(t))continue;if(clauses.some(cl=>re.test(cl)&&!/(没|没有|尚未|未能|还没|准备|打算|想要|计划|明天|等会|没来得及)/.test(cl)))out.push(id)}return out}
function downloadBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`GamingLife-backup-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);notify('备份已导出，请妥善保存')}
function inputHandler(e){if(e.target?.id==='import-file'&&e.target.files?.[0]){const file=e.target.files[0];if(file.size>2_000_000){notify('备份过大，请确认文件是否正确');return}const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(v.version!==1||!Array.isArray(v.tasks)||!Array.isArray(v.events)||!Array.isArray(v.notes))throw new Error('format');if(!confirm('导入将替换此浏览器当前所有 Gaming Life 记录。请确认已备份原数据。'))return;state={...DEFAULT(),...v};save();render();notify('备份导入完成')}catch(err){notify('文件格式不正确，未修改当前记录')}};reader.readAsText(file)}}
function submitHandler(e){if(e.target?.id==='pack-form'){e.preventDefault();try{validatedPack=checkPack(String(new FormData(e.target).get('pack-json')||''));const raw=e.target.querySelector('#pack-json').value;render();const input=el('pack-json');if(input)input.value=raw;notify('任务包检查通过，请确认导入');}catch(err){validatedPack=null;notify(err.message||'任务包格式不正确')}return}if(e.target?.id==='create-form'){e.preventDefault();const f=new FormData(e.target);const title=String(f.get('title')||'').trim();if(!title)return;const kind=f.get('kind')==='main'?'main':'side',xp=Number(f.get('xp'))||15,area=String(f.get('area')||'career');let task={id:uid(),title,detail:String(f.get('detail')||'').trim(),kind,area,xp,repeat:['once','daily','weekly'].includes(f.get('repeat'))?f.get('repeat'):'once',icon:areaInfo(area)[2],active:true};state.tasks.push(task);if(kind==='main')state.mainId=task.id;save();modal='';render();notify('已创建新任务');return}if(e.target?.id==='side-form'){e.preventDefault();const ids=[...new FormData(e.target).getAll('side')].slice(0,2);state.sideChoice[today()]=ids;save();modal='';render();notify('今日支线已更新');return}if(e.target?.id==='capture-form'){e.preventDefault();const ids=[...new FormData(e.target).getAll('matched')];const content=pendingText;state.notes.push({id:uid(),text:content,date:today(),at:new Date().toISOString()});let n=0;for(const id of ids){const t=taskById(id);if(t&&!taskCompleted(t)){state.events.push({id:uid(),taskId:t.id,title:t.title,xp:t.xp,area:t.area,kind:t.kind,date:today(),at:new Date().toISOString(),note:content});n++}}save();modal='';pendingText='';pendingIds=[];render();notify(n?`已记录，并确认完成 ${n} 项任务`:'已保存今天的日志');return}}
function clickHandler(e){const btn=e.target.closest('button[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;if(action==='nav')return navigate(btn.dataset.screen);if(action==='close'){modal='';validatedPack=null;render();return}if(action==='open-pack'){validatedPack=null;modal='pack';render();return}if(action==='confirm-pack'){if(validatedPack)importPack(validatedPack);return}if(action==='copy-snapshot'){copySnapshot();return}if(action==='open-create'){modal='create';render();return}if(action==='choose-sides'){modal='sides';render();return}if(action==='choose-main'){modal='main';render();return}if(action==='set-main'){state.mainId=id;save();modal='';render();notify('当前主线已切换');return}if(action==='complete'){let t=taskById(id);if(t)completion(t);return}if(action==='toggle-active'){let t=taskById(id);if(!t)return;t.active=t.active===false;save();render();return}if(action==='milestone'){let m=MILESTONES.find(x=>x.id===id);if(!m)return;if(state.milestones[id]){if(!confirm('撤销这项里程碑的完成记录？'))return;delete state.milestones[id];notify('已撤销里程碑')}else{if(!confirm(`确认已实际达成「${m.title}」？这会奖励 ${m.xp} XP。`))return;state.milestones[id]={at:new Date().toISOString(),date:today(),xp:m.xp};notify(`里程碑达成！+${m.xp} XP`)}save();render();return}if(action==='capture'){let raw=el('quick-input')?.value.trim();if(!raw){notify('先写一句今天完成的事情');return}pendingText=raw;pendingIds=matchText(raw);modal='capture';render();return}if(action==='export'){downloadBackup();return}if(action==='reset'){if(prompt('此操作会永久清空当前浏览器的记录。请输入「清空」以继续：')!=='清空')return;state=DEFAULT();save();navigate('today');notify('本地进度已重置')}}
document.addEventListener('input',e=>{if(e.target?.id==='pack-json'&&validatedPack){validatedPack=null;const b=el('modal-root')?.querySelector('[data-action="confirm-pack"]');if(b)b.remove();const prev=el('modal-root')?.querySelector('.pack-preview');if(prev)prev.remove();}});document.addEventListener('click',clickHandler);document.addEventListener('submit',submitHandler);document.addEventListener('change',inputHandler);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal='';render()}if(e.key==='Enter'&&e.target?.id==='quick-input'){e.preventDefault();el('app')?.querySelector('[data-action="capture"]')?.click()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==lastDate)render()});window.addEventListener('focus',()=>{if(today()!==lastDate)render()});render();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
