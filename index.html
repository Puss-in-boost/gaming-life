function migrate(v){
 const base={...DEFAULT(),...v};
 base.storylines=Array.isArray(v.storylines)?v.storylines:structuredClone(STORY_PRESETS);
 base.excusedDays=v.excusedDays&&typeof v.excusedDays==='object'&&!Array.isArray(v.excusedDays)?v.excusedDays:{};
 base.tasks=(Array.isArray(v.tasks)?v.tasks:structuredClone(DEFAULT_TASKS)).map(t=>{
   const inherited=LEGACY_STORY_STEPS[t.packKey||t.id];
   return {...t,
     storylineId:t.storylineId??(inherited?inherited[0]:null),
     chapterId:t.chapterId??(inherited?inherited[1]:null),
     targetCount:Number.isInteger(t.targetCount)&&t.targetCount>=1?t.targetCount:(inherited?inherited[2]:1),
     publishedAt:t.publishedAt||null, updatedAt:t.updatedAt||null,
     sourceLabel:t.sourceLabel||(t.packKey?'历史任务包':'历史任务 · 首发日期未记录')
   };
 });
 base.questProgress=v.questProgress&&typeof v.questProgress==='object'&&!Array.isArray(v.questProgress)?v.questProgress:{};
 base.progressHistory=Array.isArray(v.progressHistory)?v.progressHistory:[];
 if(v.rewardEconomyVersion===2){
   base.rewards=Array.isArray(v.rewards)?v.rewards:structuredClone(DEFAULT_REWARDS);
   base.redemptions=Array.isArray(v.redemptions)?v.redemptions:[];
   return base;
 }
 const oldEarn=(Array.isArray(v.events)?v.events:[]).reduce((n,e)=>n+(Number(e.xp)||0),0)
    +Object.values(v.milestones||{}).reduce((n,m)=>n+(Number(m?.xp)||0),0);
 const oldSpends=(Array.isArray(v.redemptions)?v.redemptions:[]).reduce((n,r)=>n+(Number(r.price??r.cost)||0)*(r.status==='cancelled'?0:1),0);
 const next={...base,rewardEconomyVersion:2,legacyCoinCredit:Math.max(0,oldEarn-oldSpends),
   rewards:Array.isArray(v.rewards)?v.rewards.map(r=>({ ...r,price:Number(r.price??r.cost)||35,rmb:Number(r.rmb)||0,category:r.category||'旧奖励' })):structuredClone(DEFAULT_REWARDS),
   redemptions:Array.isArray(v.redemptions)?v.redemptions.map(r=>({...r,price:Number(r.price??r.cost)||0,rmb:0,legacy:true,status:r.status||'used',date:r.date||String(r.at||r.redeemedAt||'').slice(0,10)})):[],
   events:(v.events||[]).map(e=>({...e,coins:0})),milestones:Object.fromEntries(Object.entries(v.milestones||{}).map(([id,m])=>[id,{...m,coins:0}]))};
 // Preserve old wallets, not old free/paid recommendations. New defaults are available without discarding custom entries.
 for(const reward of DEFAULT_REWARDS)if(!next.rewards.some(r=>r.id===reward.id))next.rewards.push({...reward});
 return next;
}

function checkPack(raw){
 if(typeof raw!=='string'||raw.length>45000)throw Error('任务包文本过长（最多45KB）');

 if(typeof pack.title!=='string'||!pack.title.trim()||pack.title.length>90)throw Error('任务包名称不能为空且不超过90字');
 if(!Array.isArray(pack.quests)||pack.quests.length===0||pack.quests.length>30)throw Error('任务数必须在1–30之间');
 const used=new Set();const normalized=[];
 for(const q of pack.quests){
  if(!q||typeof q!=='object'||Array.isArray(q))throw Error('任务格式不正确');
  const id=q.id, title=q.title, detail=q.detail??'';
  if(typeof id!=='string'||! /^[a-zA-Z0-9_-]{1,60}$/.test(id)||used.has(id))throw Error('任务 id 无效或重复');
  used.add(id);
  if(typeof title!=='string'||!title.trim()||title.length>65)throw Error(`任务 ${id} 的标题无效（最多65字）`);
  if(typeof detail!=='string'||detail.length>250)throw Error(`任务 ${id} 的说明过长`);
  if(!['main','side'].includes(q.kind)||!AREAS.some(a=>a[0]===q.area)||!['once','daily','weekly'].includes(q.repeat))throw Error(`任务 ${id} 的类别/领域/周期无效`);
  if(!Number.isInteger(q.xp)||q.xp<5||q.xp>80)throw Error(`任务 ${id} 的 XP 应为5–80之间的整数`);if(q.coins!==undefined&&(!Number.isInteger(q.coins)||q.coins<0||q.coins>80))throw Error(`任务 ${id} 的奖励币应为0–80`);
  if(q.chapterId!==undefined&&(typeof q.chapterId!=='string'||! /^[a-zA-Z0-9_-]{1,60}$/.test(q.chapterId)))throw Error('chapterId 必须是章节 ID');
  if(q.targetCount!==undefined&&(!Number.isInteger(q.targetCount)||q.targetCount<1||q.targetCount>100))throw Error('targetCount 必须为 1–100');
  normalized.push({id, title:title.trim(),detail:detail.trim(),kind:q.kind,area:q.area,repeat:q.repeat,xp:q.xp,coins:q.coins,chapterId:q.chapterId??null,targetCount:q.targetCount??1});
 }
 if(pack.focusId!==undefined&&pack.focusId!==null&&(!used.has(pack.focusId)||normalized.find(q=>q.id===pack.focusId)?.kind!=='main'))throw Error('focusId 必须指向本任务包中的主线任务');
 let story=null;
 if(pack.storyline!==undefined){
   const a=pack.storyline;
   if(!a||typeof a!=='object'||Array.isArray(a)||typeof a.id!=='string'||! /^[a-zA-Z0-9_-]{1,60}$/.test(a.id)||
      typeof a.title!=='string'||!a.title.trim()||a.title.length>80||typeof a.goal!=='string'||!a.goal.trim()||a.goal.length>250||
      !Array.isArray(a.chapters)||a.chapters.length<1||a.chapters.length>12)throw Error('storyline 主线目标或章节无效');
   const seen=new Set();
   story={id:a.id,title:a.title.trim(),goal:a.goal.trim(),chapters:a.chapters.map(c=>{
      if(!c||typeof c.id!=='string'||! /^[a-zA-Z0-9_-]{1,60}$/.test(c.id)||seen.has(c.id)||
         typeof c.title!=='string'||!c.title.trim()||c.title.length>80||
         (c.goal!==undefined&&(typeof c.goal!=='string'||c.goal.length>200)))throw Error('章节 ID、名称或目标无效');
      seen.add(c.id);return{id:c.id,title:c.title.trim(),goal:String(c.goal||'').trim()};
   })};
 }
 if(normalized.some(q=>q.chapterId&&(!story||!story.chapters.some(c=>c.id===q.chapterId))))throw Error('任务 chapterId 没有对应的 storyline 章节');

function chapterStats(story,chapter){

function missedContractDays(t){
 if(!t.strictDaily||t.kind!=='main'||t.repeat!=='daily'||t.active===false||!t.strictSince)return [];
 const end=today(),start=dateOffset(-7),first=t.strictSince>start?t.strictSince:start;

  const date=dateOffset(-i);
  if(date<first||date>=end)continue;
  if(state.events.some(e=>e.taskId===t.id&&e.date===date))continue;
  if(state.excusedDays?.[t.id+'|'+date])continue;

}

号隔离。云端优先模式不支持离线编辑，建议定期手动导出重要备份。</p><div class="data-actions"><button class="btn btn-primary" data-action="export">↓ 导出 JSON 备份</button><label class="btn" for="import-file">↑ 导入备份</label><input type="file" id="import-file" accept=".json,application/json" hidden><button class="btn btn-danger" data-action="reset">清空并重新开始</button></div></div><div class="panel" style="margin-top:15px"><h3>🤖 什么是「智能」？</h3><p>V1 的推荐和一句话识别使用本地规则，不是大语言模型。我们先验证一键完成、每日推荐和成长反馈是否真的顺手；如果有效，再接入可选 AI、云端同步和更灵活的任务计划。</p></div><div class="footnote">Gaming Life V1.6 · 电脑本地优先 / 手机可选云端优先</div>`}

if(modal==='create')return `<div class="modal-wrap" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-top"><h2 id="dialog-title">＋ 创建新任务</h2><button class="modal-close" data-action="close" aria-label="关闭">×</button></div><form id="create-form"><div class="field"><label for="task-title">任务名称</label><input id="task-title" name="title" required maxlength="65" placeholder="例如：完成论文第五章图表校对"></div><div class="field"><label for="task-detail">完成标准（可选）</label><textarea id="task-detail" name="detail" maxlength="250" placeholder="怎样才算真正完成？"></textarea></div><div class="grid2"><div class="field"><label for="task-kind">类别</label><select id="task-kind" name="kind"><option value="side">支线</option><option value="main">主线</option></select></div><div class="field"><label for="task-repeat">重复周期</label><select id="task-repeat" name="repeat"><option value="once">仅一次</option><option value="daily">每天</option><option value="weekly">每周</option></select></div></div><div class="grid2"><div class="field"><label for="task-area">成长方向</label><select id="task-area" name="area">${AREAS.map(a=>`<option value="${a[0]}">${a[2]} ${a[1]}</option>`).join('')}</select></div><div class="field"><label for="task-xp">完成 XP</label><select id="task-xp" name="xp"><option value="10">10 · 小任务</option><option value="15">15 · 普通支线</option><option value="30">30 · 深度任务</option><option value="50">50 · 重要主线</option></select></div></div><div class="modal-actions"><button type="button" class="btn" data-action="close">取消</button><button type="submit" class="btn btn-primary">创建任务</button></div></form></div></div>`;
if(modal==='sides')return `<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-top"><h2 id="dialog-title">今天想做哪些支线？</h2><button class="modal-close" data-action="close" aria-label="关闭">×</button></div><p class="hint">最多选2项，完全可以不选。完成的支线不会重复刷 XP。</p><form id="side-form">${activeTasks().filter(t=>t.kind==='side').map(t=>`<label class="checkline"><input type="checkbox" name="side" value="${safe(t.id)}" ${currentSides().some(s=>s.id===t.id)?'checked':''}><span>${safe(t.icon)} <strong>${safe(t.title)}</strong><br><span class="hint">${t.xp} XP ${taskCompleted(t)?'· 本周期已完成':''}</span></span></label>`).join('')}<div class="modal-actions"><button type="button" class="btn" data-action="close">取消</button><button type="submit" class="btn btn-primary">使用今天的选择</button></div></form></div></div>`;

if(modal==='capture')return `<div class="modal-wrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-top"><h2 id="dialog-title">核对你的记录</h2><button class="modal-close" data-action="close" aria-label="关闭">×</button></div><p>${safe(pendingText)}</p><p class="hint">下面只是本地关键词猜测，勾选确实完成的任务才会获得 XP。</p><form id="capture-form">${pendingIds.length?pendingIds.map(id=>{let t=taskById(id);return t?`<label class="checkline"><input type="checkbox" name="matched" value="${safe(id)}" checked ${taskCompleted(t)?'disabled':''}><span>${safe(t.icon)} <strong>${safe(t.title)}</strong><br><span class="hint">${taskCompleted(t)?'本周期已经记录':'完成后 +'+t.xp+' XP'}</span></span></label>`:''}).join(''):'<p class="hint">没有发现明确匹配的任务。你仍可以保存这句日志。</p>'}<div class="modal-actions"><button type="button" class="btn" data-action="close">取消</button><button type="submit" class="btn btn-primary">确认并保存记录</button></div></form></div></div>`;return ''}
function matchText(raw){const rules=[['thesis',/(论文|盲审|正文|改了第.?章|修改了|修订了)/],['workout',/(练了|健身|训练|排球|锻炼|跑步|拉伸|恢复训练)/],['learn',/(读了|阅读了|学了|学习了|看书|经济学|新概念)/],['career',/(求职|投递了|岗位|简历|面试)/],['money',/(记账|收支|预算|财务)/],['social',/(联系了|交流了|约了朋友|主动发消息)/],['explore',/(出游|旅行|逛了|探索了)/]];const clauses=raw.split(/[，,。；;、\n]/).map(s=>s.trim()).filter(Boolean);const out=[];for(const [id,re] of rules){const t=taskById(id);if(!t||t.active===false||taskCompleted(t))continue;if(clauses.some(cl=>re.test(cl)&&!/(没|没有|尚未|未能|还没|准备|打算|想要|计划|明天|等会|没来得及)/.test(cl)))out.push(id)}return out}
function downloadBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`GamingLife-backup-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);notify('备份已导出，请妥善保存')}
function inputHandler(e){if(e.target?.id==='import-file'&&window.GamingLifeCloud?.status().mode==='cloud'&&!window.GamingLifeCloud.status().canEdit){notify('云端暂不可编辑，请先登录同步');return}if(e.target?.id==='import-file'&&e.target.files?.[0]){const file=e.target.files[0];if(file.size>2_000_000){notify('备份过大，请确认文件是否正确');return}const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(v.version!==1||!Array.isArray(v.tasks)||!Array.isArray(v.events)||!Array.isArray(v.notes)||('rewards' in v&&!Array.isArray(v.rewards))||('redemptions' in v&&!Array.isArray(v.redemptions)))throw new Error('format');if(!confirm('导入将替换此浏览器当前所有 Gaming Life 记录。请确认已备份原数据。'))return;state=migrate(v);save();render();notify('备份导入完成')}catch(err){notify('文件格式不正确，未修改当前记录')}};reader.readAsText(file)}}
function submitHandler(e){
 if(['progress-form','reward-budget-form','pack-form','reward-create-form','create-form','side-form','capture-form'].includes(e.target?.id)&&window.GamingLifeCloud?.status().mode==='cloud'&&!window.GamingLifeCloud.status().canEdit){e.preventDefault();notify('云端同步未就绪；请先连接并完成保存');return}
 if(e.target?.id==='cloud-config-form'){e.preventDefault();const f=new FormData(e.target);cloudAction(()=>window.GamingLifeCloud.configure(f.get('url'),f.get('key')));return}
 if(e.target?.id==='cloud-auth-form'){e.preventDefault();const f=new FormData(e.target);cloudAction(()=>window.GamingLifeCloud.login(f.get('email'),f.get('password')));return}
if(e.target?.id==='progress-form'){
 e.preventDefault();const f=new FormData(e.target),t=taskById(String(f.get('taskId')||''));
 if(!t){notify('找不到任务，刷新后重试');return}
 const status=String(f.get('status')||''),note=String(f.get('note')||'');
 if(saveProgress(t,status,note)){progressTaskId=null;modal='';render();notify(status==='review'?'记录好了，待确认后再领取奖励':'进度已记录，今天的努力没有丢失')}
 return;
 }
if(e.target?.id==='reward-budget-form'){e.preventDefault();const b=Number(new FormData(e.target).get('budget'));if(!Number.isInteger(b)||b<0||b>300){notify('请输入0到300元之间的整数');return}if(b<committedRmb()){notify('预算不能低于本月已预留金额；可先取消未兑现奖励');return}state.monthlyRewardBudgetRmb=b;if(save()){render();notify('本月奖励预算已更新')}return}if(e.target?.id==='pack-form'){e.preventDefault();try{validatedPack=checkPack(String(new FormData(e.target).get('pack-json')||''));const raw=e.target.querySelector('#pack-json').value;render();const input=el('pack-json');if(input)input.value=raw;notify('任务包检查通过，请确认导入');}catch(err){validatedPack=null;notify(err.message||'任务包格式不正确')}return}if(e.target?.id==='reward-create-form'){e.preventDefault();const form=new FormData(e.target);const title=String(form.get('title')||'').trim(),detail=String(form.get('detail')||'').trim(),price=Number(form.get('price')),rmb=Number(form.get('rmb')); if(!title||title.length>40||detail.length>180||!Number.isInteger(price)||price<1||price>2000||!Number.isInteger(rmb)||rmb<0||rmb>300){notify('请输入有效的奖励名称与1–1000枚金币的价格');return}const icon=String(form.get('icon')||'🎁');if(!['🎁','🎮','🍰','🎬','🧭','🏸','☕','🎨'].includes(icon))return notify('奖励图标无效');state.rewards.push({id:uid(),title,detail,price,rmb,category:rmb?'低预算':'免费体验',icon,active:true});if(save()){modal='';navigate('rewards');notify('新奖励已加入商店')}return}
if(e.target?.id==='create-form'){e.preventDefault();const f=new FormData(e.target);const title=String(f.get('title')||'').trim();if(!title)return;const kind=f.get('kind')==='main'?'main':'side',xp=Number(f.get('xp'))||15,area=String(f.get('area')||'career');let task={id:uid(),title,coins:kind==='main'?Math.round(xp/2):Math.round(xp/2),detail:String(f.get('detail')||'').trim(),kind,area,xp,repeat:['once','daily','weekly'].includes(f.get('repeat'))?f.get('repeat'):'once',icon:areaInfo(area)[2],active:true};state.tasks.push(task);if(kind==='main'){const previous=getMain();if(previous&&previous.id!==task.id)state.secondaryMainId=previous.id;state.mainId=task.id;}save();modal='';render();notify('已创建新任务');return}if(e.target?.id==='side-form'){e.preventDefault();const ids=[...new FormData(e.target).getAll('side')].slice(0,2);state.sideChoice[today()]=ids;save();modal='';render();notify('今日支线已更新');return}if(e.target?.id==='capture-form'){e.preventDefault();const ids=[...new FormData(e.target).getAll('matched')];const content=pendingText;state.notes.push({id:uid(),text:content,date:today(),at:new Date().toISOString()});let n=0;for(const id of ids){const t=taskById(id);if(t&&!taskCompleted(t)){state.events.push({id:uid(),taskId:t.id,title:t.title,xp:t.xp,coins:awardCoins(t),area:t.area,kind:t.kind,date:today(),at:new Date().toISOString(),note:content});n++}}save();modal='';pendingText='';pendingIds=[];render();notify(n?`已记录 ${n} 项任务，奖励已发放到冒险币余额`:'已保存今天的日志');return}}
function clickHandler(e){const btn=e.target.closest('button[data-action]');if(!btn)return;const action=btn.dataset.action,id=btn.dataset.id;if(action==='nav')return navigate(btn.dataset.screen);
 if(action==='cloud-accept-latest'){if(!confirm('这将丢弃当前页面尚未上传的修改，以云端最新版本为准。可以先在设置中手动导出 JSON 备份。确定继续？'))return;cloudAction(()=>window.GamingLifeCloud.choose('cloud'));return}
 if(action==='cloud-mode-on'){
  if(!confirm('切换到云端优先将使用 Supabase 的存档，并清除本设备 IndexedDB、localStorage 的完整游戏记录及旧本机备份（不会自动下载文件）。确认此前的本地进展都已同步，或已自行导出需要保留的备份？'))return;
  cloudAction(()=>window.GamingLifeCloud.enterCloudMode());return;
 }
 if(action==='cloud-mode-off'){
  if(!confirm(window.GamingLifeCloud.status().hasCloudData?'切回本地优先将把当前云端存档保存在本设备，以便离线使用。继续？':'云端尚未加载存档。切换回本地优先将从默认空白游戏开始，并保存到此设备。继续？'))return;
  cloudAction(()=>window.GamingLifeCloud.enterLocalMode());return;
 }
 if(action==='cloud-signup'){const f=el('cloud-auth-form');if(f&&!f.reportValidity())return;const d=new FormData(f);cloudAction(()=>window.GamingLifeCloud.login(d.get('email'),d.get('password'),'signup'));return}
 if(action==='cloud-logout'){const c=window.GamingLifeCloud.status();if(c.mode==='cloud'&&window.GamingLifeCloud.hasUnsynced()){notify('有尚未上传的进展，请先重试同步或手动导出 JSON 后再退出');return}if(confirm(c.mode==='cloud'?'退出后本设备将不再展示云端游戏记录，重新登录可恢复。继续？':'退出云端账号？本地任务和奖励记录仍会保留。'))cloudAction(()=>window.GamingLifeCloud.logout());return}
 if(action==='cloud-sync'){cloudAction(()=>window.GamingLifeCloud.reconcile(true));return}
 if(action==='cloud-use-cloud'){if(!confirm('会先下载此设备的完整 JSON 备份，再用云端存档替换本地。确认？'))return;downloadBackup();cloudAction(()=>window.GamingLifeCloud.choose('cloud'));return}
 if(action==='cloud-use-local'){if(!confirm('以本地记录作为最终版本，并覆盖当前云端存档？云端旧记录会先下载备份。'))return;cloudAction(async()=>{try{downloadCloudJson(await window.GamingLifeCloud.cloudBackup())}catch(e){if(!e.message.includes('没有云端存档'))throw e}await window.GamingLifeCloud.choose('local')});return}
if(['complete','toggle-active','milestone','redeem','reward-used','reward-cancel','capture','reset','set-main','focus-main'].includes(action)&&window.GamingLifeCloud?.status().mode==='cloud'&&!window.GamingLifeCloud.status().canEdit){notify('云端正在保存或当前离线，暂不可修改任务');return}
if(action==='close'){modal='';validatedPack=null;render();return}if(action==='open-career'){validatedPack=checkPack(JSON.stringify(CAREER_SPRINT_PACK));modal='pack';render();const input=el('pack-json');if(input)input.value=JSON.stringify(CAREER_SPRINT_PACK,null,2);return}if(action==='open-starter'){validatedPack=checkPack(JSON.stringify(PERSONAL_STARTER_PACK));modal='pack';render();const input=el('pack-json');if(input)input.value=JSON.stringify(PERSONAL_STARTER_PACK,null,2);return}if(action==='open-pack'){validatedPack=null;modal='pack';render();return}if(action==='confirm-pack'){if(validatedPack)importPack(validatedPack);return}if(action==='copy-snapshot'){copySnapshot();return}if(action==='open-reward-create'){modal='reward-create';render();return}if(action==='redeem'){redeemReward(id);return}if(action==='reward-used'){markRewardUsed(id);return}if(action==='reward-cancel'){cancelRedemption(id);return}if(action==='open-create'){modal='create';render();return}if(action==='choose-sides'){modal='sides';render();return}if(action==='choose-main'){modal='main';render();return}if(action==='open-progress'){const t=taskById(id);if(!t||taskCompleted(t))return;progressTaskId=id;modal='progress';render();return}if(action==='set-main'||action==='focus-main'){focusMain(id);return}if(action==='complete'){let t=taskById(id);if(t)completion(t);return}if(action==='toggle-active'){let t=taskById(id);if(!t)return;t.active=t.active===false;save();render();return}if(action==='milestone'){let m=MILESTONES.find(x=>x.id===id);if(!m)return;if(state.milestones[id]){if(coinsEarned()-(Number(state.milestones[id].coins)||0)<coinsSpent())return notify('这笔冒险币已用于兑换奖励，不能直接撤销 BOSS 记录');if(!confirm('撤销这项里程碑的完成记录？'))return;delete state.milestones[id];notify('已撤销里程碑')}else{if(!confirm(`确认已实际达成「${m.title}」？这会奖励 ${m.xp} XP。`))return;state.milestones[id]={at:new Date().toISOString(),date:today(),xp:m.xp,coins:Math.min(100,Math.round(m.xp/2))};notify(`BOSS 通关！+${m.xp} XP · 🪙 +${state.milestones[id].coins}`)}save();render();return}if(action==='capture'){let raw=el('quick-input')?.value.trim();if(!raw){notify('先写一句今天完成的事情');return}pendingText=raw;pendingIds=matchText(raw);modal='capture';render();return}if(action==='export'){downloadBackup();return}if(action==='reset'){if(window.GamingLifeCloud?.status().mode==='cloud'){notify('云端模式已禁止直接清空：请切回本地优先，并确认云端同步后再决定是否重置');return}if(prompt('此操作会永久清空当前浏览器的记录。请输入「清空」以继续：')!=='清空')return;state=DEFAULT();save();navigate('today');notify('本地进度已重置')}}
document.addEventListener('input',e=>{if(e.target?.id==='pack-json'&&validatedPack){validatedPack=null;const b=el('modal-root')?.querySelector('[data-action="confirm-pack"]');if(b)b.remove();const prev=el('modal-root')?.querySelector('.pack-preview');if(prev)prev.remove();}});document.addEventListener('click',clickHandler);document.addEventListener('submit',submitHandler);document.addEventListener('change',inputHandler);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal='';render()}if(e.key==='Enter'&&e.target?.id==='quick-input'){e.preventDefault();el('app')?.querySelector('[data-action="capture"]')?.click()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==lastDate)render()});window.addEventListener('focus',()=>{if(today()!==lastDate)render()});
async function startGame(){
 const cloud=window.GamingLifeCloud;
 if(cloud){
  try{
   const hydrated=await cloud.boot(state,async next=>{
    state=migrate(next||DEFAULT());save(true);render();
   },()=>state,cloudUpdated);
   state=migrate(hydrated||DEFAULT());
   if(cloud.status().mode!=='cloud')save(true);
  }catch(e){console.warn('Gaming Life local boot fallback',e)}
 }
 render();
}
startGame();
window.addEventListener('beforeunload',e=>{
 if(window.GamingLifeCloud?.hasUnsynced()){
  e.preventDefault();e.returnValue=''; // Unsynced cloud-only edits exist only in memory.
 }
});
})();
</script>
